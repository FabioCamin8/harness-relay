name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installed-artifact:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Test installed wheel outside the checkout
        run: |
          test_root="$(mktemp -d)"
          cp -R tests "$test_root/tests"
          cd "$test_root"
          env -u PYTHONPATH python -m unittest discover -s tests -v
      - name: Inspect distributions
        run: |
          python -m zipfile -l dist/*.whl
          python -m tarfile -l dist/*.tar.gz

  public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common private runtime material
        run: |
          ! git grep -nE '(/r[o]ot/|192[.]168[.][0-9]+[.][0-9]+|B[E]GIN (RSA |OPENSSH |EC )?P[R]IVATE KEY|s[k]-[A-Za-z0-9]{20,})' -- ':!docs/ACCEPTANCE.md'
          test -z "$(git ls-files | grep -E '(^|/)(\.env|.*\.db|.*\.sqlite|.*\.pem|id_rsa|id_ed25519)$' || true)"
